name: build

on:
  workflow_dispatch:
  push:
    paths:
      - 'configs/**'
      - '.github/workflows/build.yml'

permissions:
  contents: write

env:
  REPO_URL: https://github.com/genshanxinli/xr1710g-openwrt
  REPO_BRANCH: xr1710g

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout build repo
        uses: actions/checkout@v5

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
            /opt/hostedtoolcache/CodeQL /usr/local/share/boost
          df -h /

      - name: Install build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3 python3-setuptools rsync swig unzip zlib1g-dev file wget \
            subversion ccache

      - name: Clone firmware source
        run: |
          git clone --branch "$REPO_BRANCH" --depth 1 "$REPO_URL" openwrt
          cd openwrt
          echo "source=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Configure
        run: |
          cd openwrt
          cp ../configs/xr1710g.config .config
          ./scripts/feeds update -a
          ./scripts/feeds install -a
          make defconfig

      - name: Download sources
        run: cd openwrt && make download -j8

      - name: Compile
        run: cd openwrt && make -j"$(nproc)" || make -j1 V=s

      - name: Collect images
        run: |
          cd openwrt
          mkdir -p ../out
          find bin/targets -maxdepth 3 -type f \
            \( -name '*.itb' -o -name '*.bin' -o -name '*.manifest' \
               -o -name 'sha256sums' -o -name 'profiles.json' \) \
            -exec cp {} ../out/ \;
          ls -la ../out

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: xr1710g-${{ env.source }}
          path: out/
          if-no-files-found: error

      - name: Release
        if: github.event_name == 'workflow_dispatch'
        run: |
          TAG="xr1710g-$(date +%Y.%m.%d)-${{ env.source }}"
          gh release create "$TAG" out/* --title "$TAG" --notes "Source: $REPO_URL@${{ env.source }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
